---
argument_specs:
  main:
    author: Michael Buluma
    description: 'Install the minimum required set of packages (python and sudo) to
      allow Ansible to manage a system. This role tries to figure out what to install
      and uses the raw module to install the packages.

      '
    options:
      bootstrap_timeout:
        default: 3
        description: Time (in seconds) to wait for connection.
        type: int
      bootstrap_wait_for_host:
        default: false
        description: Wait for the machine to be available.
        type: bool
    short_description: Prepare a system to be managed by Ansible.
